<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Dashboard — Mandaê</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8fafd;color:#1e293b;min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:40px 24px}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.badge{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700}
.bn{background:#0d1b4b;color:#fff}.bb{background:#eff3ff;color:#1652f0}
.card{background:#fff;border-radius:16px;border:1px solid #dde3f0;padding:28px;margin-bottom:20px;box-shadow:0 4px 20px rgba(22,82,240,0.06)}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sn{width:28px;height:28px;border-radius:50%;background:#1652f0;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.st{font-size:15px;font-weight:700;color:#0d1b4b}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ub{border:2px dashed #dde3f0;border-radius:12px;padding:22px;text-align:center;cursor:pointer;transition:all .2s;background:#f8fafd}
.ub:hover{border-color:#1652f0;background:#f0f4ff}
.ub.ok{border-color:#0eb887;border-style:solid;background:#f0fdf9}
.ui{font-size:26px;margin-bottom:6px}
.ub.ok .ui{color:#0eb887}
.ut{font-size:13px;color:#64748b}
.un{font-size:13px;font-weight:600;color:#0eb887;margin-top:3px;display:none}
.us{font-size:11px;color:#94a3b8;margin-top:2px}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tog{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #dde3f0;background:#fff;color:#94a3b8;font-family:inherit}
.tog.on{background:#eff3ff;color:#1652f0;border-color:#1652f0}
.btn{width:100%;padding:15px;font-size:15px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#0d3fa8,#1652f0);color:#fff;cursor:pointer;font-family:inherit;margin-top:4px}
.btn:hover{opacity:.9}
.err{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:12px 16px;font-size:13px;color:#991b1b;margin-bottom:16px;display:none}
.ok-area{text-align:center;padding:40px 20px;display:none}
.oi{font-size:56px;margin-bottom:16px}
.oh{font-size:22px;font-weight:800;color:#0d1b4b;margin-bottom:8px}
.os{font-size:14px;color:#64748b;margin-bottom:28px}
.bdl{display:inline-block;padding:14px 36px;font-size:15px;font-weight:700;border:none;border-radius:12px;background:linear-gradient(135deg,#0d3fa8,#1652f0);color:#fff;cursor:pointer;font-family:inherit;margin-right:10px}
.brs{display:inline-block;padding:13px 30px;font-size:14px;font-weight:600;border:1.5px solid #1652f0;border-radius:12px;background:#fff;color:#1652f0;cursor:pointer;font-family:inherit}
.info{background:#f8fafd;border:1px solid #dde3f0;border-radius:10px;padding:14px 16px;font-size:12px;color:#475569;line-height:1.8;margin-top:12px}
.info code{font-family:monospace;font-size:11px;background:#eff3ff;padding:1px 5px;border-radius:4px;color:#1652f0}
@media(max-width:560px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="logo-row">
    <span class="badge bn">Mandaê</span>
    <span style="color:#94a3b8;font-size:18px">×</span>
    <span class="badge bb">Dashboard Generator</span>
  </div>

  <div id="form-area">
    <div class="card">
      <div class="sh"><div class="sn">1</div><div class="st">Upload dos arquivos</div></div>
      <div class="g2">
        <div>
          <div style="font-size:12px;color:#64748b;margin-bottom:6px;font-weight:600">📊 Arquivo de Performance</div>
          <div class="ub" id="box-p" onclick="document.getElementById('inp-p').click()">
            <div class="ui" id="ico-p">⬆</div>
            <div class="ut">Relatório de Envios<br><span style="font-size:11px">(.xlsx)</span></div>
            <div id="nm-p" class="un"></div>
            <div id="sh-p" class="us"></div>
          </div>
          <input type="file" id="inp-p" accept=".xlsx,.xls" style="display:none" onchange="loadPerf(this)">
        </div>
        <div>
          <div style="font-size:12px;color:#64748b;margin-bottom:6px;font-weight:600">🎧 Arquivo de Tickets CS</div>
          <div class="ub" id="box-t" onclick="document.getElementById('inp-t').click()">
            <div class="ui" id="ico-t">⬆</div>
            <div class="ut">Relatório de ocorrências<br><span style="font-size:11px">(Relacionamento...xlsx)</span></div>
            <div id="nm-t" class="un"></div>
            <div id="sh-t" class="us"></div>
          </div>
          <input type="file" id="inp-t" accept=".xlsx,.xls" style="display:none" onchange="loadTkt(this)">
        </div>
      </div>

    </div>

    <div class="card">
      <div class="sh"><div class="sn">2</div><div class="st">Seções do painel</div></div>
      <div class="toggles">
        <button class="tog on" id="tog-m" onclick="tog('m')">📋 Sobre a Mandaê</button>
        <button class="tog on" id="tog-p" onclick="tog('p')">📊 Performance</button>
        <button class="tog on" id="tog-t" onclick="tog('t')">🎧 Tickets CS</button>
      </div>
    </div>

    <div id="err" class="err"></div>
    <button class="btn" onclick="generate()">⚡ Gerar Dashboard HTML</button>
  </div>

  <div class="ok-area" id="ok-area">
    <div class="oi">🎉</div>
    <div class="oh" id="ok-title">Dashboard gerado!</div>
    <div class="os" id="ok-sub">Clique abaixo para baixar o HTML.</div>
    <button class="bdl" onclick="downloadHTML()">⬇ Download do HTML</button>
    <button class="brs" onclick="reset()">Gerar outro</button>
  </div>
</div>

<script>
// ── state ──
let perfData=null, tktData=null;
let secM=true,secP=true,secT=true;
let genHTML='';

function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display=m?'block':'none';}
function tog(s){
  if(s==='m'){secM=!secM;document.getElementById('tog-m').classList.toggle('on',secM);}
  if(s==='p'){secP=!secP;document.getElementById('tog-p').classList.toggle('on',secP);}
  if(s==='t'){secT=!secT;document.getElementById('tog-t').classList.toggle('on',secT);}
}

function readXlsx(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{try{res(XLSX.read(e.target.result,{type:'array',cellDates:true}));}catch(err){rej(err);}};
    r.onerror=rej;r.readAsArrayBuffer(f);
  });
}

// UF → region
function ufReg(uf){
  if(['SP','RJ','MG','ES'].includes(uf)) return 'Sudeste';
  if(['PR','SC','RS'].includes(uf)) return 'Sul';
  if(['DF','GO','MT','MS'].includes(uf)) return 'Centro-Oeste';
  if(['BA','PE','CE','MA','PB','RN','AL','SE','PI'].includes(uf)) return 'Nordeste';
  return 'Norte';
}

async function loadPerf(inp){
  const f=inp.files[0]; if(!f)return;
  try{
    const wb=await readXlsx(f);
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
    // normalise column names for alternate format
    const nomeCol=Object.keys(rows[0]||{}).find(c=>c.toLowerCase().includes('nome'));
    rows.forEach(r=>{
      if(nomeCol&&nomeCol!=='nome') r.nome=r[nomeCol];
      // parse dates — Date obj, Excel serial, dd/mm/yyyy, yyyy-mm-dd
      ['data_envio','data_previsao_entrega_cliente','data_entrega'].forEach(k=>{
        const v=r[k];
        if(!v){ r[k+'_d']=null; return; }
        if(v instanceof Date){ r[k+'_d']=v; return; }
        if(typeof v==='number'){ r[k+'_d']=new Date((v-25569)*86400000); return; }
        if(typeof v==='string'){
          const dm=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
          if(dm){ r[k+'_d']=new Date(+dm[3],+dm[2]-1,+dm[1]); return; }
          r[k+'_d']=new Date(v);
        }
      });
    });
    // filter out summary/total rows
    const validRows=rows.filter(r=>r.status&&r.status!=='Total'&&r.servico_envio&&r.servico_envio!=='Total'&&r['data_envio_d']&&!isNaN(r['data_envio_d']));
    // group by month
    const byMonth={};
    validRows.forEach(r=>{
      const m=r['data_envio_d'].getMonth()+1;
      if(!byMonth[m]) byMonth[m]=[];
      byMonth[m].push(r);
    });
    // compute stats per month
    perfData={};
    const cliente=validRows.find(r=>r.nome)?.nome||'Cliente';
    perfData.cliente=cliente;
    const mesesExcel=Object.keys(byMonth).map(Number).sort((a,b)=>a-b);
    perfData.meses=mesesExcel;
    mesesExcel.forEach(m=>{
      const mrs=byMonth[m];
      const total=mrs.length;
      const entregues=mrs.filter(r=>r.status==='Entregue').length;
      const devolvidas=mrs.filter(r=>r.status&&(r.status.toLowerCase().includes('devolv')||r.status.toLowerCase().includes('em devolução'))).length;
      const extraviadas=mrs.filter(r=>r.status==='Extraviada').length;
      const enviadas=mrs.filter(r=>r.status==='Enviada'||r.status==='Aguardando retirada do destinatário').length;
      const atrasados=mrs.filter(r=>{
        const de=r['data_entrega_d'],dp=r['data_previsao_entrega_cliente_d'];
        return de&&dp&&!isNaN(de)&&!isNaN(dp)&&de>dp;
      }).length;
      const ticketMedio=mrs.reduce((s,r)=>s+(Number(r.preco_frete)||0),0)/total;
      const rapido=mrs.filter(r=>r.servico_envio==='Rápido').length;
      const economico=mrs.filter(r=>r.servico_envio==='Econômico').length;
      // regions
      const regCounts={Sudeste:0,Sul:0,'Centro-Oeste':0,Nordeste:0,Norte:0};
      const regFretes={Sudeste:[],Sul:[],  'Centro-Oeste':[],Nordeste:[],Norte:[]};
      mrs.forEach(r=>{const rg=ufReg(r.uf);if(regCounts[rg]!==undefined){regCounts[rg]++;regFretes[rg].push(Number(r.preco_frete)||0);}});
      const regTicket={};
      Object.keys(regFretes).forEach(rg=>{const arr=regFretes[rg];regTicket[rg]=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;});
      perfData[m]={
        total,entregues,devolvidas,extraviadas,enviadas,atrasados,
        ent_pct:total>0?entregues/total*100:0,
        atr_pct:total>0?atrasados/total*100:0,
        dev_pct:total>0?devolvidas/total*100:0,
        ext_pct:total>0?extraviadas/total*100:0,
        ticketMedio,
        eco_pct:total>0?economico/total*100:0,
        rap_pct:total>0?rapido/total*100:0,
        regCounts,regTicket
      };
    });
    document.getElementById('box-p').classList.add('ok');
    document.getElementById('ico-p').textContent='✓';
    const nm=document.getElementById('nm-p');nm.textContent=f.name;nm.style.display='block';
    document.getElementById('sh-p').textContent=mesesExcel.length+' meses encontrados';
  }catch(e){showErr('Erro no arquivo de performance: '+e.message);}
}

async function loadTkt(inp){
  const f=inp.files[0]; if(!f)return;
  try{
    const wb=await readXlsx(f);
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:null});
    // find month ticket cols
    const sample=rows[0]||{};
    const allCols=Object.keys(sample);
    const MESES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const monthCols={};
    MESES_PT.forEach((mn,i)=>{
      const col=allCols.find(c=>c.includes(mn)&&c.includes('Tickets')&&!c.includes('SUM'));
      if(col) monthCols[i+1]=col;
    });
    // filter real ocorrencia rows
    const occ_rows=rows.filter(r=>{
      const org=String(r['Nome da Organização']||'');
      const occ=String(r['Ocorrência']||'').trim();
      return org!=='SUM'&&occ&&occ!==' '&&occ!=='null';
    });
    tktData={meses:Object.keys(monthCols).map(Number).sort((a,b)=>a-b)};
    Object.entries(monthCols).forEach(([m,col])=>{
      const mn=Number(m);
      const occs=[];
      occ_rows.forEach(r=>{
        const q=Number(r[col])||0;
        if(q>0) occs.push({label:String(r['Ocorrência']).trim(),qtd:q});
      });
      occs.sort((a,b)=>b.qtd-a.qtd);
      const total=occs.reduce((s,o)=>s+o.qtd,0);
      tktData[mn]={total,occs};
    });
    document.getElementById('box-t').classList.add('ok');
    document.getElementById('ico-t').textContent='✓';
    const nm=document.getElementById('nm-t');nm.textContent=f.name;nm.style.display='block';
    document.getElementById('sh-t').textContent=tktData.meses.length+' meses encontrados';
  }catch(e){showErr('Erro no arquivo de tickets: '+e.message);}
}

// ── formatters ──
function fN(n){if(n==null||isNaN(n))return'—';return Number(n).toLocaleString('pt-BR');}
function fP(n,d=2){if(n==null||isNaN(n))return'—';return Number(n).toFixed(d).replace('.',',')+"%";}
function fR(n){if(n==null||isNaN(n))return'—';return'R$ '+Number(n).toFixed(2).replace('.',',');}

const MESES_LABELS=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABREV=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const RN=['Sudeste','Sul','Centro-Oeste','Nordeste','Norte'];
const RC=['#1652f0','#00b4d8','#0077b6','#ef4444','#f59e0b'];
const OC=['#1652f0','#00b4d8','#0077b6','#90e0ef','#caf0f8','#2563eb','#38bdf8','#0ea5e9','#7dd3fc','#bae6fd'];
const PAL=['#0d3fa8','#1652f0','#2563eb','#00b4d8','#90e0ef','#0ea5e9','#7dd3fc'];

function buildPerfPanel(d,m,idx){
  const lbl=MESES_LABELS[m], abr=MESES_ABREV[m];
  if(!d) return`<div class="sub-panel${idx===0?' active':''}" id="perf-${m}"><p style="color:#94a3b8;padding:20px">Sem dados para ${lbl}.</p></div>`;
  const reg=RN.map(r=>d.regCounts[r]||0);
  const regT=reg.reduce((a,b)=>a+b,0)||1;
  const tR=RN.map(r=>d.regTicket[r]||0);
  const regRows=RN.map((r,i)=>{
    const q=reg[i];const p=regT>0?(q/regT*100).toFixed(1):'0.0';
    const t=tR[i];const tc=i<2?'var(--teal)':i<3?'var(--amber)':'var(--red)';
    return`<tr><td style="padding:10px 12px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);font-weight:500">${i<2?'🔵':'🔴'} ${r}</td><td style="padding:10px 12px;border-bottom:1px solid var(--gray-100);text-align:right;color:var(--gray-600)">${fN(q)}</td><td style="padding:10px 12px;border-bottom:1px solid var(--gray-100);text-align:right;color:var(--gray-600)">${p}%</td><td style="padding:10px 12px;border-bottom:1px solid var(--gray-100);text-align:right;font-weight:700;color:${tc}">${fR(t)}</td></tr>`;
  }).join('');
  const stL=[],stD=[],stC=[];
  if(d.entregues){stL.push('Entregues');stD.push(d.entregues);stC.push('#0eb887');}
  if(d.devolvidas){stL.push('Devolvidas');stD.push(d.devolvidas);stC.push('#ef4444');}
  if(d.extraviadas){stL.push('Extraviadas');stD.push(d.extraviadas);stC.push('#f59e0b');}
  if(d.enviadas){stL.push('Enviadas');stD.push(d.enviadas);stC.push('#1652f0');}
  const cd=JSON.stringify({stL,stD,stC,reg,regT,mE:+(d.eco_pct).toFixed(2),mR:+(d.rap_pct).toFixed(2),atQ:d.atrasados,pac:d.total,devP:+d.dev_pct.toFixed(2),extP:+d.ext_pct.toFixed(2),tR:tR.map(v=>+v.toFixed(2))});
  return`<div class="sub-panel${idx===0?' active':''}" id="perf-${m}">
<div class="grid-4" style="margin-bottom:24px">
<div class="metric-card blue"><div class="m-label">📦 Pacotes</div><div class="m-value">${fN(d.total)}</div><div class="m-sub">${lbl.toLowerCase()} 2026</div><div class="m-icon">📦</div></div>
<div class="metric-card teal"><div class="m-label">✅ Entregues</div><div class="m-value">${fP(d.ent_pct)}</div><div class="m-sub">${fN(d.entregues)} de ${fN(d.total)} · meta: 95%</div><div class="m-icon">✅</div></div>
<div class="metric-card amber"><div class="m-label">⏰ Atrasos</div><div class="m-value">${fP(d.atr_pct)}</div><div class="m-sub">${fN(d.atrasados)} entregas · meta ≤2%</div><div class="m-icon">⏰</div></div>
<div class="metric-card blue"><div class="m-label">🏷️ Ticket Médio</div><div class="m-value">${fR(d.ticketMedio)}</div><div class="m-sub">frete por remessa</div><div class="m-icon">🏷️</div></div>
</div>
<div class="grid-3" style="margin-bottom:24px">
<div class="card"><div class="card-header"><div class="card-title">Pacotes por Status</div><span style="background:#eff3ff;color:var(--blue);font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px">${abr}</span></div><div style="position:relative;height:200px"><canvas id="st${abr}C"></canvas></div></div>
<div class="card"><div class="card-header"><div class="card-title">Distribuição Regional</div><span style="background:#eff3ff;color:var(--blue);font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px">${abr}</span></div><div style="position:relative;height:200px"><canvas id="rg${abr}C"></canvas></div><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px;font-size:11px;color:var(--gray-600)" id="rg${abr}L"></div></div>
<div class="card"><div class="card-header"><div class="card-title">Modalidade</div><span style="background:#eff3ff;color:var(--blue);font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px">${abr}</span></div><div style="position:relative;height:200px"><canvas id="md${abr}C"></canvas></div><div style="display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:11px;color:var(--gray-600)"><span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block"></span>Econômico ${d.eco_pct.toFixed(1).replace('.',',')}%</span><span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#90e0ef;display:inline-block"></span>Rápido ${d.rap_pct.toFixed(1).replace('.',',')}%</span></div></div>
</div>
<div class="grid-2" style="margin-bottom:24px">
<div class="card"><div class="card-header"><div class="card-title">Índice de Atrasos</div><span style="background:#fef3c7;color:var(--amber);font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px">${abr}</span></div><div style="position:relative;height:180px"><canvas id="at${abr}C"></canvas></div></div>
<div class="card"><div class="card-header"><div class="card-title">Devoluções &amp; Extravios</div><span style="background:#fee2e2;color:#991b1b;font-size:11px;font-weight:600;padding:3px 10px;border-radius:100px">${abr}</span></div><div style="position:relative;height:180px"><canvas id="de${abr}C"></canvas></div><div style="display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:11px"><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block"></span><span style="color:var(--gray-600)">Dev: <strong>${fN(d.devolvidas)}</strong> (${fP(d.dev_pct)})</span></span><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:#f59e0b;display:inline-block"></span><span style="color:var(--gray-600)">Ext: <strong>${fN(d.extraviadas)}</strong> (${fP(d.ext_pct)})</span></span></div></div>
</div>
<div class="card"><div class="card-header"><div class="card-title">Ticket Médio por Região — ${lbl} 2026</div></div><div class="grid-2" style="gap:20px"><div style="position:relative;height:240px"><canvas id="tr${abr}C"></canvas></div>
<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>
<th style="font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.8px;padding:0 12px 12px;text-align:left;border-bottom:1px solid var(--gray-200)">Região</th>
<th style="font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.8px;padding:0 12px 12px;text-align:right;border-bottom:1px solid var(--gray-200)">Remessas</th>
<th style="font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.8px;padding:0 12px 12px;text-align:right;border-bottom:1px solid var(--gray-200)">% Vol.</th>

  /* ─── CHART BARS ─── */
  .mini-chart { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
  .bar {
    flex: 1;
    background: var(--blue);
    border-radius: 4px 4px 0 0;
    opacity: 0.7;
    transition: opacity 0.2s;
    position: relative;
  }
  .bar:hover { opacity: 1; }
  .bar.highlight { opacity: 1; background: var(--teal); }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .section.active > * { animation: fadeUp 0.4s ease both; }
  .section.active > *:nth-child(2) { animation-delay: 0.05s; }
  .section.active > *:nth-child(3) { animation-delay: 0.1s; }
  .section.active > *:nth-child(4) { animation-delay: 0.15s; }
  .section.active > *:nth-child(5) { animation-delay: 0.2s; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: 1fr; }
    .grid-2, .grid-2-1 { grid-template-columns: 1fr; }
    .header-inner { flex-direction: column; align-items: flex-start; }
    .header-meta { align-items: flex-start; }
    .nav { padding: 0 20px; overflow-x: auto; }
    .section { padding: 28px 20px; }
    .ra-hero { flex-direction: column; gap: 20px; }
    .ra-divider { display: none; }
    .ra-metrics { grid-template-columns: repeat(2, 1fr); }
  }
  /* ─── SUB-TABS ─── */
  .sub-nav {
    display: flex;
    gap: 4px;
    background: var(--gray-100);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
    width: fit-content;
  }
  .sub-btn {
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-400);
    background: none;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .sub-btn:hover { color: var(--blue); }
  .sub-btn.active {
    background: #fff;
    color: var(--blue);
    box-shadow: 0 2px 8px rgba(22,82,240,0.12);
  }
  .sub-panel { display: none; }
  .sub-panel.active { display: block; }
</style>`;

function generate(){
  showErr('');
  if(secP&&!perfData){showErr('Suba o arquivo de Performance para gerar essa seção.');return;}
  if(secT&&!tktData){showErr('Suba o arquivo de Tickets para gerar essa seção.');return;}
  if(!secM&&!secP&&!secT){showErr('Selecione pelo menos uma seção.');return;}

  const cliente=perfData?perfData.cliente:(tktData?'Cliente':'Cliente');
  const perfMeses=perfData?perfData.meses:[];
  const tktMeses=tktData?tktData.meses:[];
  const allMeses=[...new Set([...perfMeses,...tktMeses])].sort((a,b)=>a-b);
  if(allMeses.length===0){showErr('Nenhum mês encontrado nos arquivos.');return;}

  const first=secM?'modelo':secP?'performance':'tickets';
  const navBtns=[];
  if(secM) navBtns.push(`<button class="nav-btn" data-target="modelo">Sobre a Mandaê</button>`);
  if(secP) navBtns.push(`<button class="nav-btn" data-target="performance">📊 Performance</button>`);
  if(secT) navBtns.push(`<button class="nav-btn" data-target="tickets">🎧 Tickets CS</button>`);
  const navHTML=navBtns.map((b,i)=>i===0?b.replace('class="nav-btn"','class="nav-btn active"'):b).join('\n');

  let perfSec='',tktSec='';
  if(secP&&perfData){
    const meses=perfMeses;
    const subBtns=meses.map((m,i)=>`<button class="sub-btn${i===0?' active':''}" onclick="showSubPanel('perf-${m}',this)">📅 ${MESES_LABELS[m]} 2026</button>`).join('')+`<button class="sub-btn" onclick="showSubPanel('perf-comp',this)">📊 Comparativo</button>`;
    const panels=meses.map((m,i)=>buildPerfPanel(perfData[m],m,i)).join('');
    const comp=buildCompPerf(perfData,meses);
    // period string
    const mFirst=MESES_LABELS[meses[0]].substring(0,3), mLast=MESES_LABELS[meses[meses.length-1]].substring(0,3);
    perfSec=`<section class="section${first==='performance'?' active':''}" id="performance"><div class="sec-label">Resultados Operacionais</div><div class="sec-title">Performance — ${cliente}</div><div class="sec-desc">Acompanhamento de entregas, atrasos, devoluções e ticket médio por região. ${mFirst}–${mLast} 2026.</div><div class="sub-nav">${subBtns}</div>${panels}${comp}</section>`;
  }
  if(secT&&tktData){
    const meses=tktMeses;
    const subBtns=meses.map((m,i)=>`<button class="sub-btn${i===0?' active':''}" onclick="showSubPanel('tkt-${m}',this)">📅 ${MESES_LABELS[m]} 2026</button>`).join('')+`<button class="sub-btn" onclick="showSubPanel('tkt-comp',this)">📊 Comparativo</button>`;
    const panels=meses.map((m,i)=>buildTktPanel(tktData[m],m,i)).join('');
    const comp=buildCompTkt(tktData,perfData,meses);
    const mFirst=MESES_LABELS[meses[0]].substring(0,3), mLast=MESES_LABELS[meses[meses.length-1]].substring(0,3);
    tktSec=`<section class="section${first==='tickets'?' active':''}" id="tickets"><div class="sec-label">Atendimento ao Cliente</div><div class="sec-title">Tickets CS — ${cliente}</div><div class="sec-desc">Principais ocorrências, volume por tipo e comparativo mensal. ${mFirst}–${mLast} 2026.</div><div class="sub-nav">${subBtns}</div>${panels}${comp}</section>`;
  }
  const mSec=secM?MHTML.replace('class="section"','class="section'+(first==='modelo'?' active':'')+'"'):'';
  const today=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const bHTML=mSec+perfSec+tktSec;
  const cJS=buildChartJS(bHTML);
  genHTML=`<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mandaê × ${cliente} — Painel da Parceria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>
${DCSS}
</head>
<body>
<header class="header"><div class="header-inner"><div class="header-left"><div class="logo-row"><span class="logo-badge">Mandaê</span><span class="logo-sep">×</span><span class="logo-badge">${cliente}</span></div><div class="header-title">Mandaê × ${cliente} — Painel da Parceria</div><div class="header-sub">Painel de acompanhamento da parceria</div></div><div class="header-meta"><span class="parceria-badge">✦ Parceria Ativa</span><span class="date-label">Atualizado em ${today}</span></div></div></header>
<nav class="nav" id="main-nav">${navHTML}</nav>
${bHTML}
<script>${cJS}<\/script>
</body>
</html>`;

  document.getElementById('form-area').style.display='none';
  const ok=document.getElementById('ok-area');ok.style.display='block';
  document.getElementById('ok-title').textContent='Dashboard de '+cliente+' gerado!';
  document.getElementById('ok-sub').textContent='Clique abaixo para baixar o HTML.';
}

function downloadHTML(){
  const blob=new Blob([genHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=(perfData?perfData.cliente:'dashboard').replace(/\s+/g,'-').toLowerCase()+'-dashboard.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

function reset(){
  genHTML='';perfData=null;tktData=null;
  document.getElementById('form-area').style.display='block';
  document.getElementById('ok-area').style.display='none';
  ['box-p','box-t'].forEach(id=>document.getElementById(id).classList.remove('ok'));
  ['ico-p','ico-t'].forEach((id,i)=>document.getElementById(id).textContent='⬆');
  ['nm-p','nm-t'].forEach(id=>{const e=document.getElementById(id);e.textContent='';e.style.display='none';});
  ['sh-p','sh-t'].forEach(id=>document.getElementById(id).textContent='');
  showErr('');
}
</script>
</body>
</html>
